name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, mbstring, dom, curl
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Fetch public RUM distribution for local capture
        run: curl --fail --silent --show-error --retry 2 --connect-timeout 10 --max-time 30 https://rum.corridora.com/corridora-rum.js -o .tools-rum.js
      - name: SDK and actual browser RUM parentage
        run: RUM_BUNDLE_PATH="$PWD/.tools-rum.js" python3 tests/run_validation.py
